# Glimpse configuration.
#
# Copy this file to config.yaml (which git ignores) and edit it.
# Anything secret is written as ${NAME} and filled in from .env, so this file
# never needs to contain a feed link, slug, password or key.
#
# Check your work any time with:   glimpse check
# See what someone will see with:  glimpse preview --audience coworkers

timezone: America/New_York        # any IANA time zone name
refresh_minutes: 10               # how often feeds are re-downloaded
week_starts: monday               # or sunday

server:
  host: 127.0.0.1                 # keep this: only the tunnel should reach Glimpse
  port: 8000
  base_url: ${GLIMPSE_BASE_URL}   # your public address, e.g. https://my-pc.tail1234.ts.net
  secret_key: ${GLIMPSE_SECRET_KEY}

# The settings panel (http://127.0.0.1:8001). Publish it to your own devices with
#   tailscale serve --bg --https=8443 http://127.0.0.1:8001
# Set its password with `glimpse admin-password`.
admin:
  port: 8001
  password_hash: ${GLIMPSE_ADMIN_PASSWORD_HASH}
  allowed_tailscale_users: []       # e.g. [you@example.com] to limit it to your Tailscale login

# ---------------------------------------------------------------------------
# Calendars: one entry per feed. The key (left side) is the id you use below.
#   name   shown in the legend and in full/title views
#   label  shown instead of the title at the `label` level (default: name)
#   color  optional hex colour, e.g. "#2f9e44"
#   local  true for a Glimpse calendar made on the My calendars page (url is then its
#          .ics file in local-calendars/; share: true + share_slug gives it a subscription link)
#   marker optional shape on its events and in the legend: circle, square, triangle,
#          diamond, star, ring, cross, heart, or an emoji such as "🎓"
#          (helps when colours are hard to tell apart)
# ---------------------------------------------------------------------------
calendars:
  personal:
    name: Personal
    url: ${GOOGLE_PERSONAL_ICS}
  lab:
    name: Lab
    url: ${OUTLOOK_LAB_ICS}
    marker: triangle
  classes:
    name: Classes
    label: Class
    url: ${OUTLOOK_CLASSES_ICS}
  family:
    name: Family
    url: ${ICLOUD_FAMILY_ICS}
  office_hours:                         # a Glimpse calendar (made on My calendars)
    name: Office hours
    url: local-calendars/office_hours.ics
    local: true
    share: false

# ---------------------------------------------------------------------------
# Per-event overrides. These only ever REDUCE detail, for every audience.
#   Put "#private" in an event's title or notes -> shown as Busy at most.
#   Put "#hide" in an event's title or notes    -> not shown to anyone.
#   Events marked Private in Outlook/Google     -> shown as Busy at most.
# ---------------------------------------------------------------------------
overrides:
  private_tag: "#private"
  hide_tag: "#hide"
  honor_private_flag: true
  merge_duplicates: true   # show an event once if it's on several calendars

# ---------------------------------------------------------------------------
# Groups (optional): set one level for several calendars at once, per audience.
# A calendar can be in at most one group. Precedence for an audience:
#   calendar setting  >  group setting  >  default
# ---------------------------------------------------------------------------
groups:
  work:
    name: Work
    calendars: [lab, classes]
    # label, color and marker are used by audiences with `group_names: true`

# ---------------------------------------------------------------------------
# Privacy rules (optional): matching events are shown as Busy (or hidden) to
# EVERY audience. Keywords match whole words, ignoring capitals and accents.
#   fields     where to look: title, notes, location (default: all three)
#   action     busy (default) or hidden
#   calendars  only apply to these calendars (default: all)
#   except_audiences  audiences the rule does NOT apply to (e.g. [partner])
# New setups start with suggested Health / Job search / Money and legal rules;
# delete the `rules:` list's entries (keep `rules: []`) if you don't want them.
# ---------------------------------------------------------------------------
rules:
  - name: Health
    match: [doctor, dentist, therapy]
  - name: Job hunt
    match: [interview]
    action: hidden

# ---------------------------------------------------------------------------
# Audiences: who sees what. Levels, most to least revealing:
#   full    title, time, location, notes
#   title   title and time
#   label   the calendar's label (e.g. "Class") and time
#   busy    an anonymous "Busy" block
#   hidden  nothing
# `default` applies to any calendar not listed under `calendars` or `groups`.
# ---------------------------------------------------------------------------
audiences:
  partner:
    title: "My week"
    slug: ${PARTNER_SLUG}
    password_hash: ${PARTNER_PW_HASH}   # remove this line for a link-only page
    default: full
    weeks_ahead: 6                      # how far ahead they can browse (0-104, or null for all)
    weeks_behind: 1
    calendars:
      lab: title

  coworkers:
    title: "Availability"
    slug: ${COWORKER_SLUG}
    password_hash: null                 # link only
    default: busy
    groups:
      work: title                       # every Work calendar at `title`...
    weeks_ahead: 3
    weeks_behind: 0
    group_names: true                   # they see "Work" rather than "Lab" and "Classes"
    hours: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "18:00" }
    show_all_day_busy: false            # all-day events at `busy` level are usually reminders
    allow_excel: true
    allow_ics: true                     # lets them subscribe in their own calendar app
    views: [day, week, month, quarter, year] # which views they can switch between
    default_view: week
    timezone: null                      # e.g. Europe/Berlin to show times there by default
    shared_link: true                   # false: only people's own links (below) work
    calendars:
      classes: label                    # ...except Classes, which shows only "Class"
      family: hidden
    requests:                           # optional: let them ask for a meeting
      enabled: true
      lengths: [30, 60]                 # minutes they can choose
      slots: true                       # pick one of your open times
      suggest: true                     # ...or suggest another time
      hours: null                       # when meetings can happen; null = the audience's hours
      notice_hours: 24                  # nothing sooner than this
      days_ahead: 14                    # how far ahead open times are offered
      step_minutes: 30                  # start times every 15, 30 or 60 minutes
      message: "Meetings are on Zoom unless we say otherwise."
      auto_confirm: false               # true: picked open times are booked straight away
      calendar: office_hours            # a Glimpse calendar that confirmed meetings are added to
      meeting_link: https://zoom.us/j/1234567890  # shown only once a meeting is confirmed
      location: null                    # or a room / address
      booking: false                    # a public booking page with its own link
      booking_slug: null                # the panel makes one when you switch it on
      platforms: [zoom, jitsi]          # a new meeting per booking; they pick one (see video_calls)
    widget:                             # optional: free/busy view to embed in a website
      enabled: false
      slug: ${GLIMPSE_AUD_COWORKERS_WIDGET_SLUG}  # its own link (the panel makes one)
      sites: [https://www.example.edu]  # sites allowed to embed it; [] = any
      days: 7

# ---------------------------------------------------------------------------
# People (optional): someone's own link into an audience. Move them by changing
# `audience`; their link keeps working and shows the new view. Links stop working
# after `expires`. Without their own password_hash they use the audience's
# (set use_audience_password: false for no password at all).
# ---------------------------------------------------------------------------
people:
  alex:
    name: Alex
    audience: partner
    slug: ${GLIMPSE_PERSON_ALEX_SLUG}
  priya:
    name: Priya
    audience: coworkers
    slug: ${GLIMPSE_PERSON_PRIYA_SLUG}
    expires: 2026-12-31

# Shown to viewers in other time zones ("Show Brandon's time") and on expired links.
owner_name: null

# Show a small "Support the project" link at the bottom of shared pages (off by default).
support_link: false

# ---------------------------------------------------------------------------
# Meeting requests: how open times are worked out, and how you hear about requests.
# Open times leave out every busy event on all calendars (not just what an
# audience sees) plus waiting/accepted requests. Events marked "free" never count.
# ---------------------------------------------------------------------------
availability:
  ignore_calendars: [family]            # calendars that never make you busy
  buffer_minutes: 10                    # kept free before and after busy times
  all_day_busy: false                   # true: all-day events (trips) block the whole day

notify:                                 # switch on any mix; secrets live in .env
  ntfy:                                 # phone push via the free ntfy app
    enabled: true
    server: https://ntfy.sh
    topic: ${GLIMPSE_NTFY_TOPIC}        # long and unguessable; subscribe to it in the app
  email:
    enabled: false
    smtp_host: smtp.gmail.com           # Gmail: use an app password
    smtp_port: 587
    security: starttls                  # starttls (587), ssl (465) or none
    username: you@gmail.com
    password: ${GLIMPSE_SMTP_PASSWORD}
    to_addr: null                       # where your notifications go (default: the sender)
    notify_requester: true              # also email people about their own requests
  discord:
    enabled: false
    webhook_url: ${GLIMPSE_DISCORD_WEBHOOK}
  panel_url: null                       # link in notifications; default: your tailnet address :8443

# ---------------------------------------------------------------------------
# Video calls (optional): make a new Zoom / Teams / Google Meet meeting for each
# booking. Easiest from the panel's Video calls page, which has step-by-step help.
# Teams and Google Meet also need a one-time sign-in there; it's kept in
# video-accounts.json beside this file.
# ---------------------------------------------------------------------------
video_calls:
  zoom:                                 # a Server-to-Server OAuth app (marketplace.zoom.us)
    enabled: false
    account_id: null
    client_id: null
    client_secret: null                 # the panel keeps it in .env (GLIMPSE_ZOOM_CLIENT_SECRET)
    user: you@example.com               # the Zoom login the meetings belong to
    waiting_room: true
  teams:                                # an app registration in Microsoft Entra (work/school accounts)
    enabled: false
    client_id: null                     # Application (client) ID; no secret needed
    tenant: organizations
  google:                               # an OAuth client in Google Cloud (Meet REST API)
    enabled: false
    client_id: null
    client_secret: null                 # the panel keeps it in .env (GLIMPSE_GOOGLE_CLIENT_SECRET)
    open_access: false                  # true: anyone with the link joins without asking
  webex:                                # an integration at developer.webex.com
    enabled: false
    client_id: null
    client_secret: null                 # the panel keeps it in .env (GLIMPSE_WEBEX_CLIENT_SECRET)
  jitsi:                                # nothing to set up: a new random room per booking
    enabled: false
    server: https://meet.jit.si         # or your own Jitsi server

# ---------------------------------------------------------------------------
# School mode (optional): terms, breaks and exam weeks.
# Terms are read from `calendar_url` (your school's academic calendar feed, if
# it has one) and/or typed in below; typed-in terms win for the same dates.
# ---------------------------------------------------------------------------
school:
  enabled: false
  name: University of Example
  calendar_url: null
  class_calendars: [classes]            # these pause over breaks and between terms
  pause_classes: true
  show_viewers: true                    # viewers see "Fall 2026 · Week 7" and break days
  terms:
    - name: Fall 2026
      start: 2026-08-24                 # first day of classes
      end: 2026-12-12                   # last day, including finals
      periods:
        - { name: Thanksgiving Break, start: 2026-11-25, end: 2026-11-29, kind: break }
        - { name: Finals, start: 2026-12-07, end: 2026-12-12, kind: exams }  # break, exams or closed
