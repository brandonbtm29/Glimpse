# Glimpse configuration.
#
# Copy this file to config.yaml (which git ignores) and edit it.
# Anything secret is written as ${NAME} and filled in from .env, so this file
# never needs to contain a feed link, slug, password or key.
#
# Check your work any time with:   glimpse check
# See what someone will see with:  glimpse preview --audience coworkers

timezone: America/New_York        # any IANA time zone name
refresh_minutes: 10               # how often feeds are re-downloaded
week_starts: monday               # or sunday

server:
  host: 127.0.0.1                 # keep this: only the tunnel should reach Glimpse
  port: 8000
  base_url: ${GLIMPSE_BASE_URL}   # your public address, e.g. https://my-pc.tail1234.ts.net
  secret_key: ${GLIMPSE_SECRET_KEY}

# The settings panel (http://127.0.0.1:8001). Publish it to your own devices with
#   tailscale serve --bg --https=8443 http://127.0.0.1:8001
# Set its password with `glimpse admin-password`.
admin:
  port: 8001
  password_hash: ${GLIMPSE_ADMIN_PASSWORD_HASH}
  allowed_tailscale_users: []       # e.g. [you@example.com] to limit it to your Tailscale login

# ---------------------------------------------------------------------------
# Calendars: one entry per feed. The key (left side) is the id you use below.
#   name   shown in the legend and in full/title views
#   label  shown instead of the title at the `label` level (default: name)
#   color  optional hex colour, e.g. "#2f9e44"
#   marker optional shape on its events and in the legend: circle, square, triangle,
#          diamond, star, ring, cross or heart (helps when colours are hard to tell apart)
# ---------------------------------------------------------------------------
calendars:
  personal:
    name: Personal
    url: ${GOOGLE_PERSONAL_ICS}
  lab:
    name: Lab
    url: ${OUTLOOK_LAB_ICS}
    marker: triangle
  classes:
    name: Classes
    label: Class
    url: ${OUTLOOK_CLASSES_ICS}
  family:
    name: Family
    url: ${ICLOUD_FAMILY_ICS}

# ---------------------------------------------------------------------------
# Per-event overrides. These only ever REDUCE detail, for every audience.
#   Put "#private" in an event's title or notes -> shown as Busy at most.
#   Put "#hide" in an event's title or notes    -> not shown to anyone.
#   Events marked Private in Outlook/Google     -> shown as Busy at most.
# ---------------------------------------------------------------------------
overrides:
  private_tag: "#private"
  hide_tag: "#hide"
  honor_private_flag: true
  merge_duplicates: true   # show an event once if it's on several calendars

# ---------------------------------------------------------------------------
# Groups (optional): set one level for several calendars at once, per audience.
# A calendar can be in at most one group. Precedence for an audience:
#   calendar setting  >  group setting  >  default
# ---------------------------------------------------------------------------
groups:
  work:
    name: Work
    calendars: [lab, classes]
    # label, color and marker are used by audiences with `group_names: true`

# ---------------------------------------------------------------------------
# Privacy rules (optional): matching events are shown as Busy (or hidden) to
# EVERY audience. Keywords match whole words, ignoring capitals and accents.
#   fields     where to look: title, notes, location (default: all three)
#   action     busy (default) or hidden
#   calendars  only apply to these calendars (default: all)
# ---------------------------------------------------------------------------
rules:
  - name: Health
    match: [doctor, dentist, therapy]
  - name: Job hunt
    match: [interview]
    action: hidden

# ---------------------------------------------------------------------------
# Audiences: who sees what. Levels, most to least revealing:
#   full    title, time, location, notes
#   title   title and time
#   label   the calendar's label (e.g. "Class") and time
#   busy    an anonymous "Busy" block
#   hidden  nothing
# `default` applies to any calendar not listed under `calendars` or `groups`.
# ---------------------------------------------------------------------------
audiences:
  partner:
    title: "My week"
    slug: ${PARTNER_SLUG}
    password_hash: ${PARTNER_PW_HASH}   # remove this line for a link-only page
    default: full
    weeks_ahead: 6                      # how far ahead they can browse (0-104, or null for all)
    weeks_behind: 1
    calendars:
      lab: title

  coworkers:
    title: "Availability"
    slug: ${COWORKER_SLUG}
    password_hash: null                 # link only
    default: busy
    groups:
      work: title                       # every Work calendar at `title`...
    weeks_ahead: 3
    weeks_behind: 0
    group_names: true                   # they see "Work" rather than "Lab" and "Classes"
    hours: { days: [mon, tue, wed, thu, fri], start: "08:00", end: "18:00" }
    show_all_day_busy: false            # all-day events at `busy` level are usually reminders
    allow_excel: true
    allow_ics: true                     # lets them subscribe in their own calendar app
    views: [week, month, quarter, year] # which views they can switch between
    default_view: week
    timezone: null                      # e.g. Europe/Berlin to show times there by default
    shared_link: true                   # false: only people's own links (below) work
    calendars:
      classes: label                    # ...except Classes, which shows only "Class"
      family: hidden

# ---------------------------------------------------------------------------
# People (optional): someone's own link into an audience. Move them by changing
# `audience`; their link keeps working and shows the new view. Links stop working
# after `expires`. Without their own password_hash they use the audience's
# (set use_audience_password: false for no password at all).
# ---------------------------------------------------------------------------
people:
  alex:
    name: Alex
    audience: partner
    slug: ${GLIMPSE_PERSON_ALEX_SLUG}
  priya:
    name: Priya
    audience: coworkers
    slug: ${GLIMPSE_PERSON_PRIYA_SLUG}
    expires: 2026-12-31

# Shown to viewers in other time zones ("Show Brandon's time") and on expired links.
owner_name: null
