<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>{{ owner_possessive or "My" }} availability</title>
  <link rel="stylesheet" href="/static/widget.css?v={{ version }}">
</head>
<body>
<div class="w" data-has-tz="{{ '1' if has_tz else '0' }}" data-self="{{ self_url }}">
  <header class="w-head">
    <span class="w-title">{{ owner_possessive or "My" }} availability</span>
    <span class="w-key"><i class="w-busy-key"></i>Busy <i class="w-free-key"></i>Free</span>
  </header>
  <div class="w-grid" style="--days: {{ days | length }}">
    {% for d, parts in days %}
    <div class="w-day{% if d == today %} today{% endif %}">
      <div class="w-dh"><span>{{ fmt_day(d).split(' ')[0] }}</span><b>{{ d.day }}</b></div>
      <div class="w-col" role="img" aria-label="{{ fmt_day(d) }}: {{ 'busy at times' if parts else 'free' }}">
        {% for top, height in parts %}<i class="w-b" style="top: {{ '%.2f' % top }}%; height: {{ '%.2f' % height }}%"></i>{% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
  <footer class="w-foot">
    <span>{{ hours_label }} · {{ tz_label }}</span>
    {% if request_url %}<a class="w-btn" href="{{ request_url }}" target="_blank" rel="noopener">Request a meeting</a>{% endif %}
  </footer>
  <p class="w-brand">Shared with <a href="{{ repo_url }}" target="_blank" rel="noopener">Glimpse</a></p>
</div>
<script src="/static/widget.js?v={{ version }}" defer></script>
</body>
</html>
